apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8spsphostfilesystem
  annotations:
    description: >-
      Запрещает использование hostPath volumes.
      HostPath volumes позволяют подам получить доступ к файловой системе хоста,
      что является серьёзным риском безопасности.
spec:
  crd:
    spec:
      names:
        kind: K8sPSPHostFilesystem
      validation:
        openAPIV3Schema:
          type: object
          description: Запрещает использование hostPath volumes
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8spsphostfilesystem

        violation[{"msg": msg, "details": {}}] {
          volume := input_hostpath_volumes[_]
          msg := sprintf("Использование hostPath запрещено: volume '%v'", [volume.name])
        }

        input_hostpath_volumes[v] {
          v := input.review.object.spec.volumes[_]
          has_field(v, "hostPath")
        }

        has_field(obj, field) {
          obj[field]
        }
